services:
  api:
    image: ghcr.io/pranavmishra90/openterminal-api:latest
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "4000:4000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - ./terminal-data:/app/data
    restart: unless-stopped

  web:
    image: ghcr.io/pranavmishra90/openterminal-web:latest
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://api:4000
    depends_on:
      - api
    restart: unless-stopped

